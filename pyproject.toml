[project]
name = "relationship-bot"
version = "1.0.0"
description = "Private Discord relationship assistant for couples using discord.py, MongoDB, OpenAI, and guided UI flows."
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.5,<3.0",
  "motor>=3.6,<4.0",
  "pymongo>=4.9,<5.0",
  "openai>=1.59,<2.0",
  "Pillow>=10.4,<11.0",
  "aiohttp>=3.10,<4.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "python-json-logger>=2.0,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<2.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "ASYNC"]
ignore = ["E501", "UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
